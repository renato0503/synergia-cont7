      <path d="M20,28 L26,34 L38,22" fill="none" stroke="#ffffff" stroke-width="3"/>
      <text x="70" y="22" font-family="Arial" font-size="15" fill="#1a365d" font-weight="bold">Afastamento do Dolo</text>
      <text x="70" y="45" font-family="Arial" font-size="12" fill="#4a5568">Barracão = Ativo Agrícola, não enriquecimento ilícito</text>
    </g>
    
    <g transform="translate(-310, 60)">
      <circle cx="28" cy="28" r="22" fill="#10b981"/>
