  <!-- Text -->
  <text x="640" y="48" font-family="Arial" font-size="38" font-weight="bold" fill="#1a365d" text-anchor="middle">A PROPOSTA DE LAUDO</text>
  <text x="640" y="98" font-family="Arial" font-size="20" fill="#b45309" text-anchor="middle">Salvando o Convênio através de Ajustes Profundos</text>
