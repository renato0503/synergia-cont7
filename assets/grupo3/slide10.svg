      <text x="70" y="22" font-family="Arial" font-size="15" fill="#1a365d" font-weight="bold">Retificação Contratual</text>
      <text x="70" y="45" font-family="Arial" font-size="12" fill="#4a5568">Novo contrato formalizando Parceria Mista</text>
    </g>
    
    <g transform="translate(0, -30)">
