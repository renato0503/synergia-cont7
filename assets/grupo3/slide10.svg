    <text x="0" y="-110" font-family="Arial" font-size="26" fill="#b45309" text-anchor="middle" font-weight="bold">PROPOSTA DE LAUDO</text>
    <text x="0" y="-70" font-family="Arial" font-size="17" fill="#4a5568" text-anchor="middle">Parecer Pericial - Salvando o Convênio</text>
    
    <g transform="translate(-310, -30)">
