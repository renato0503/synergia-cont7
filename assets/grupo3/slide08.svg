<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <pattern id="grid3a" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <rect width="1280" height="720" fill="#1e293b"/>
  <rect width="1280" height="720" fill="url(#grid3a)"/>
  
  <!-- Desk -->
  <rect x="150" y="420" width="900" height="210" fill="#475569"/>
  <rect x="150" y="410" width="900" height="22" fill="#64748b"/>
  
  <!-- Accountant -->
  <g transform="translate(250, 240)">
    <circle cx="0" cy="0" r="38" fill="#f5deb3"/>
    <rect x="-33" y="38" width="66" height="88" fill="#1a365d"/>
    <text x="45" y="-22" font-family="Arial" font-size="26" fill="#f59e0b">!</text>
  </g>
  
  <!-- Bank statements -->
  <g transform="translate(400, 290)">
    <rect x="0" y="0" width="270" height="195" fill="#ffffff" transform="rotate(-3)"/>
    <text x="135" y="35" font-family="Arial" font-size="13" fill="#1a365d" text-anchor="middle" transform="rotate(-3)">EXTRATOS BANCÁRIOS</text>
    <line x1="30" y1="58" x2="240" y2="58" stroke="#c0c0c0"/>
    <line x1="30" y1="92" x2="200" y2="92" stroke="#3b82f6" stroke-width="4"/>
    <circle cx="25" cy="92" r="10" fill="#3b82f6"/>
    <text x="42" y="108" font-family="Arial" font-size="11" fill="#3b82f6">Público</text>
    <line x1="30" y1="135" x2="185" y2="135" stroke="#b45309" stroke-width="4"/>
    <circle cx="25" cy="135" r="10" fill="#b45309"/>
    <text x="42" y="152" font-family="Arial" font-size="11" fill="#b45309">Privado</text>
  </g>
  
  <!-- Timeline -->
  <g transform="translate(720, 95)">
    <rect x="0" y="0" width="480" height="130" fill="#334155" rx="10"/>
    <text x="240" y="32" font-family="Arial" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">LINHA DO TEMPO - RECLASSIFICAÇÃO</text>
    <g transform="translate(55, 75)">
      <rect x="0" y="0" width="65" height="44" fill="#4ade80" rx="5"/>
      <text x="32" y="28" font-family="Arial" font-size="11" fill="#1a365d" text-anchor="middle">Jan</text>
    </g>
    <g transform="translate(140" fill="#60a5fa" rx="5"/>
      <rect x="0" y="0" width="65" height="44" fill="#60a5fa" rx="5"/>
      <text x="32" y="28" font-family="Arial" font-size="11" fill="#ffffff" text-anchor="middle">Fev</text>
    </g>
    <g transform="translate(225, 75)">
      <rect x="0" y="0" width="65" height="44" fill="#f59e0b" rx="5"/>
      <text x="32" y="28" font-family="Arial" font-size="11" fill="#1a365d" text-anchor="middle">Mar</text>
    </g>
    <g transform="translate(310, 75)">
      <rect x="0" y="0" width="65" height="44" fill="#f59e0b" rx="5"/>
      <text x="32" y="28" font-family="Arial" font-size="11" fill="#1a365d" text-anchor="middle">Abr</text>
    </g>
    <g transform="translate(395, 75)">
      <rect x="0" y="0" width="65" height="44" fill="#4ade80" rx="5"/>
      <text x="32" y="28" font-family="Arial" font-size="11" fill="#1a365d" text-anchor="middle">Mai</text>
    </g>
  </g>
  
  <!-- Rebuilt ledger -->
  <g transform="translate(770, 310)">
    <rect x="0" y="0" width="220" height="165" fill="#ffffff"/>
    <text x="110" y="28" font-family="Arial" font-size="12" fill="#1a365d" text-anchor="middle">LIVRO RECONSTRUÍDO</text>
    <line x1="22" y1="48" x2="198" y2="48" stroke="#c0c0c0"/>
    <line x1="22" y1="72" x2="185" y2="72" stroke="#3b82f6" stroke-width="2"/>
    <line x1="22" y1="96" x2="175" y2="96" stroke="#b45309" stroke-width="2"/>
    <line x1="22" y1="120" x2="192" y2="120" stroke="#3b82f6" stroke-width="2"/>
    <line x1="22" y1="144" x2="165" y2="144" stroke="#b45309" stroke-width="2"/>
  </g>
  
  <!-- Coffee cups -->
  <g transform="translate(150, 500)">
    <ellipse cx="0" cy="32" rx="28" ry="12" fill="#ffffff"/>
    <rect x="-28" y="12" width="56" height="35" fill="#ffffff"/>
    <path d="M28,22 Q52,30 28,42" fill="none" stroke="#ffffff" stroke-width="5"/>
  </g>
  <g transform="translate(260, 512)">
    <ellipse cx="0" cy="28" rx="22" ry="10" fill="#87ceeb"/>
    <rect x="-22" y="14" width="44" height="26" fill="#87ceeb"/>
  </g>
  
  <!-- Evidence marker -->
  <g transform="translate(1060, 540)">
    <polygon points="0,0 32,-50 64,0" fill="#ffffff"/>
    <text x="32" y="-12" font-family="Arial" font-size="20" fill="#b45309" font-weight="bold">!</text>
  </g>
  
  <!-- Text -->
  <text x="640" y="48" font-family="Arial" font-size="38" font-weight="bold" fill="#ffffff" text-anchor="middle">A RECLASSIFICAÇÃO RETROATIVA</text>
  <text x="640" y="98" font-family="Arial" font-size="20" fill="#94a3b8" text-anchor="middle">Reconstruindo a Contabilidade Mês a Mês</text>
</svg>