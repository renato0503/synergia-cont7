<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="sunset" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#4a7c59"/>
    </linearGradient>
  </defs>
  
  <rect width="1280" height="720" fill="url(#sunset)"/>
  
  <!-- Farmland -->
  <ellipse cx="640" cy="570" rx="600" ry="200" fill="#4a7c59"/>
  
  <!-- Two farmers shaking hands -->
  <g transform="translate(640, 340)">
    <g transform="translate(-110, 0)">
      <circle cx="0" cy="-65" r="38" fill="#f5deb3"/>
      <rect x="-33" y="-27" width="66" height="90" fill="#1a365d"/>
      <ellipse cx="0" cy="-90" rx="50" ry="18" fill="#d4a574"/>
      <rect x="-22" y="-108" width="44" height="24" fill="#d4a574"/>
    </g>
    <g transform="translate(110, 0)">
      <circle cx="0" cy="-62" r="35" fill="#f5deb3"/>
      <rect x="-30" y="-30" width="60" height="85" fill="#2d3748"/>
      <rect x="-28" y="-95" width="56" height="18" fill="#b45309"/>
    </g>
    <path d="M-45,22 L0,5 L45,22" fill="none" stroke="#f5deb3" stroke-width="16" stroke-linecap="round"/>
    <ellipse cx="0" cy="12" rx="22" ry="14" fill="#d4af37"/>
  </g>
  
  <!-- Partnership contract -->
  <g transform="translate(980, 170)">
    <rect x="0" y="0" width="240" height="175" fill="#fff8dc" stroke="#b45309" stroke-width="3"/>
    <text x="120" y="35" font-family="Arial" font-size="15" fill="#b45309" text-anchor="middle" font-weight="bold">CONTRATO DE</text>
    <text x="120" y="58" font-family="Arial" font-size="15" fill="#b45309" text-anchor="middle" font-weight="bold">PARCERIA RURAL</text>
    <line x1="22" y1="78" x2="218" y2="78" stroke="#b45309"/>
    <text x="22" y="102" font-family="Arial" font-size="12" fill="#1a365d">Estatuto da Terra</text>
    <text x="22" y="125" font-family="Arial" font-size="12" fill="#4a5568">Lei 4.504/64</text>
    <text x="22" y="155" font-family="Arial" font-size="12" fill="#15803d">✓ Assinado</text>
  </g>
  
  <!-- Vegetable crops -->
  <g transform="translate(150, 480)">
    <rect x="0" y="0" width="90" height="55" fill="#228b22" opacity="0.5"/>
    <circle cx="25" cy="-15" r="22" fill="#ff6347"/>
    <circle cx="-5" cy="-8" r="18" fill="#228b22"/>
    <circle cx="55" cy="-5" r="20" fill="#ffd700"/>
  </g>
  <g transform="translate(290, 500)">
    <ellipse cx="0" cy="0" rx="45" ry="28" fill="#228b22" opacity="0.5"/>
    <ellipse cx="35" cy="-5" rx="28" ry="20" fill="#228b22"/>
    <ellipse cx="70" cy="8" rx="24" ry="16" fill="#4169e1"/>
  </g>
  
  <!-- Warehouse -->
  <g transform="translate(1020, 430)">
    <rect x="0" y="0" width="165" height="110" fill="#a0a0a0"/>
    <polygon points="0,0 82,-45 165,0" fill="#696969"/>
    <rect x="55" y="45" width="55" height="65" fill="#5c3d2e"/>
  </g>
  
  <!-- Text -->
  <text x="640" y="75" font-family="Arial" font-size="38" font-weight="bold" fill="#ffffff" text-anchor="middle">GESTÃO TRIBUTÁRIA E COOPERATIVISMO</text>
  <text x="640" y="125" font-family="Arial" font-size="22" fill="#1a365d" text-anchor="middle">Parceria Rural | Enquadramento Jurídico</text>
  
  <!-- Tag -->
  <rect x="500" y="640" width="280" height="55" fill="#b45309" rx="27"/>
  <text x="640" y="680" font-family="Arial" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold">SYNERGIA CONT7</text>
</svg>