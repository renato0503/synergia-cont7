<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Background -->
  <rect width="1280" height="720" fill="#fffbeb"/>
  
  <!-- Hybrid chart -->
  <g transform="translate(640, 140)">
    <text x="0" y="0" font-family="Arial" font-size="30" fill="#1a365d" text-anchor="middle" font-weight="bold">PLANO DE CONTAS HÍBRIDO</text>
    <text x="0" y="38" font-family="Arial" font-size="17" fill="#4a5568" text-anchor="middle">(Público + Cooperativa)</text>
    
    <rect x="-470" y="65" width="940" height="440" fill="#ffffff" stroke="#b45309" stroke-width="3" rx="15"/>
    
    <!-- ATIVO -->
    <g transform="translate(-360, 100)">
      <rect x="-85" y="-28" width="170" height="55" fill="#1a365d" rx="5"/>
      <text x="0" y="6" font-family="Arial" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">1. ATIVO</text>
      
      <rect x="-95" y="55" width="190" height="58" fill="#dbeafe" stroke="#3b82f6" rx="5"/>
      <text x="0" y="85" font-family="monospace" font-size="12" fill="#1a365d" text-anchor="middle">1.2.5.1.01.00.00</text>
      <text x="0" y="105" font-family="Arial" font-size="11" fill="#3b82f6" text-anchor="middle">PÚBLICO - Social</text>
      
      <rect x="-95" y="130" width="190" height="58" fill="#fef3c7" stroke="#f59e0b" rx="5"/>
      <text x="0" y="160" font-family="monospace" font-size="12" fill="#1a365d" text-anchor="middle">1.2.5.1.02.00.00</text>
      <text x="0" y="180" font-family="Arial" font-size="11" fill="#f59e0b" text-anchor="middle">PRIVADO - Agrícola</text>
    </g>
    
    <!-- PASSIVO FISCAL -->
    <g transform="translate(-360, 290)">
      <rect x="-115" y="-28" width="230" height="55" fill="#b91c1c" rx="5"/>
      <text x="0" y="6" font-family="Arial" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">2. PASSIVO FISCAL</text>
      
      <rect x="-95" y="55" width="190" height="58" fill="#fee2e2" stroke="#b91c1c" rx="5"/>
      <text x="0" y="85" font-family="monospace" font-size="12" fill="#1a365d" text-anchor="middle">2.1.2.1.01.00.00</text>
      <text x="0" y="105" font-family="Arial" font-size="11" fill="#b91c1c" text-anchor="middle">TRIBUTÁRIO</text>
    </g>
    
    <!-- RESULTADO HÍBRIDO -->
    <g transform="translate(110, 100)">
      <rect x="-125" y="-28" width="250" height="55" fill="#15803d" rx="5"/>
      <text x="0" y="6" font-family="Arial" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">3. DEMONSTRAÇÃO HÍBRIDA</text>
      
      <rect x="-105" y="55" width="210" height="52" fill="#d1fae5" stroke="#15803d" rx="5"/>
      <text x="0" y="83" font-family="monospace" font-size="12" fill="#1a365d" text-anchor="middle">3.1.2.1.01.00.00</text>
      <text x="0" y="100" font-family="Arial" font-size="11" fill="#15803d" text-anchor="middle">Receita Bruta Agrícola</text>
      
      <rect x="-105" y="122" width="210" height="52" fill="#fef3c7" stroke="#b45309" rx="5"/>
      <text x="0" y="150" font-family="monospace" font-size="12" fill="#1a365d" text-anchor="middle">3.2.1.1.01.00.00</text>
      <text x="0" y="167" font-family="Arial" font-size="11" fill="#b45309" text-anchor="middle">Despesas Sociais</text>
    </g>
    
    <!-- Legend -->
    <g transform="translate(-410, 420)">
      <rect x="0" y="0" width="160" height="45" fill="#dbeafe" stroke="#3b82f6" rx="5"/>
      <rect x="180" y="0" width="160" height="45" fill="#fef3c7" stroke="#f59e0b" rx="5"/>
      <rect x="360" y="0" width="160" height="45" fill="#fee2e2" stroke="#b91c1c" rx="5"/>
      <text x="80" y="28" font-family="Arial" font-size="13" fill="#1a365d" text-anchor="middle">Público</text>
      <text x="260" y="28" font-family="Arial" font-size="13" fill="#1a365d" text-anchor="middle">Privado/Coop</text>
      <text x="440" y="28" font-family="Arial" font-size="13" fill="#1a365d" text-anchor="middle">Tributário</text>
    </g>
  </g>
  
  <!-- Golden rule -->
  <g transform="translate(640, 650)">
    <rect x="-310" y="0" width="620" height="52" fill="#b45309" rx="26"/>
    <text x="0" y="34" font-family="Arial" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="bold">REGRA: Contas de Resultado Segregadas por Natureza Econômica</text>
  </g>
</svg>