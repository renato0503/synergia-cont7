<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Background -->
  <rect width="1280" height="720" fill="#f8fafc"/>
  
  <!-- Receita Federal building -->
  <g transform="translate(100, 140)">
    <rect x="0" y="0" width="220" height="200" fill="#1a365d"/>
    <rect x="28" y="38" width="58" height="48" fill="#87ceeb" opacity="0.5"/>
    <rect x="100" y="38" width="58" height="48" fill="#87ceeb" opacity="0.5"/>
    <rect x="172" y="38" width="45" height="48" fill="#87ceeb" opacity="0.5"/>
    <rect x="28" y="100" width="58" height="48" fill="#87ceeb" opacity="0.5"/>
    <rect x="100" y="100" width="58" height="48" fill="#87ceeb" opacity="0.5"/>
    <rect x="172" y="100" width="45" height="48" fill="#87ceeb" opacity="0.5"/>
    <text x="110" y="175" font-family="Arial" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">RECEITA FEDERAL</text>
    <text x="110" y="198" font-family="Arial" font-size="11" fill="#94a3b8" text-anchor="middle">do Brasil</text>
  </g>
  
  <!-- ITR form -->
  <g transform="translate(400, 110)">
    <rect x="0" y="0" width="270" height="195" fill="#ffffff" stroke="#b91c1c" stroke-width="3"/>
    <rect x="0" y="0" width="270" height="45" fill="#b91c1c"/>
    <text x="135" y="32" font-family="Arial" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">ITR</text>
    <text x="25" y="78" font-family="Arial" font-size="12" fill="#4a5568">Imposto Territorial Rural</text>
    <text x="25" y="108" font-family="Arial" font-size="12" fill="#1a365d">Lei 9.393/96</text>
    <text x="25" y="148" font-family="Arial" font-size="14" fill="#b91c1c" font-weight="bold">Responsabilidade</text>
    <text x="25" y="172" font-family="Arial" font-size="14" fill="#b91c1c" font-weight="bold">Solidária</text>
  </g>
  
  <!-- Funrural document -->
  <g transform="translate(720, 120)">
    <rect x="0" y="0" width="270" height="195" fill="#ffffff" stroke="#b45309" stroke-width="3"/>
    <rect x="0" y="0" width="270" height="45" fill="#b45309"/>
    <text x="135" y="32" font-family="Arial" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">FUNRURAL</text>
    <text x="25" y="78" font-family="Arial" font-size="12" fill="#4a5568">PIS/COFINS Rural</text>
    <text x="25" y="108" font-family="Arial" font-size="12" fill="#1a365d">Alíquota: 2,5%</text>
    <text x="25" y="148" font-family="Arial" font-size="14" fill="#1a365d" font-weight="bold">Sobre receita bruta</text>
    <text x="25" y="172" font-family="Arial" font-size="12" fill="#b45309">Comercialização agrícola</text>
  </g>
  
  <!-- Harvest sale -->
  <g transform="translate(380, 380)">
    <rect x="0" y="0" width="320" height="165" fill="#ffffff" stroke="#c0c0c0" stroke-width="2"/>
    <text x="160" y="32" font-family="Arial" font-size="15" fill="#1a365d" text-anchor="middle" font-weight="bold">VENDA DA PRODUÇÃO</text>
    <g transform="translate(35, 65)">
      <rect x="0" y="0" width="65" height="55" fill="#d4a574"/>
      <circle cx="32" cy="-12" r="20" fill="#ff6347"/>
    </g>
    <g transform="translate(130, 75)">
      <rect x="0" y="0" width="65" height="55" fill="#c4956a"/>
      <ellipse cx="32" cy="-5" rx="22" ry="16" fill="#228b22"/>
    </g>
    <g transform="translate(225, 70)">
      <rect x="0" y="0" width="65" height="55" fill="#d4a574"/>
      <circle cx="32" cy="-8" r="18" fill="#ffd700"/>
    </g>
    <rect x="35" y="130" width="110" height="28" fill="#d1fae5"/>
    <text x="90" y="150" font-family="Arial" font-size="11" fill="#15803d" text-anchor="middle">+ NF-e</text>
  </g>
  
  <!-- Audit risk -->
  <g transform="translate(870, 340)">
    <rect x="0" y="0" width="320" height="220" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
    <text x="160" y="32" font-family="Arial" font-size="15" fill="#b91c1c" text-anchor="middle" font-weight="bold">RISCO FISCAL IDENTIFICADO</text>
    <line x1="30" y1="52" x2="290" y2="52" stroke="#fca5a5"/>
    <text x="30" y="82" font-family="Arial" font-size="12" fill="#1a365d">• CNAE incompatível</text>
    <text x="30" y="110" font-family="Arial" font-size="12" fill="#1a365d">• Sem retenção Funrural</text>
    <text x="30" y="138" font-family="Arial" font-size="12" fill="#1a365d">• Passivo fiscal acumulado</text>
    <text x="30" y="178" font-family="Arial" font-size="13" fill="#b91c1c" font-weight="bold">Possível configuração de</text>
    <text x="30" y="202" font-family="Arial" font-size="13" fill="#b91c1c" font-weight="bold">sonegação fiscal</text>
  </g>
  
  <!-- Warning -->
  <g transform="translate(90, 610)">
    <rect x="0" y="0" width="520" height="65" fill="#b91c1c" rx="10"/>
    <text x="260" y="42" font-family="Arial" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold">OMISSÃO = SONEGAÇÃO</text>
  </g>
  
  <!-- Text -->
  <text x="640" y="48" font-family="Arial" font-size="38" font-weight="bold" fill="#1a365d" text-anchor="middle">RISCOS FISCAIS: ITR E FUNRURAL</text>
  <text x="640" y="98" font-family="Arial" font-size="20" fill="#b91c1c" text-anchor="middle">Parceria com comercialização atrai olhos da Receita Federal</text>
</svg>