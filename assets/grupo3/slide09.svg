<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Background -->
  <rect width="1280" height="720" fill="#f8fafc"/>
  
  <!-- Auditor -->
  <g transform="translate(180, 240)">
    <circle cx="0" cy="0" r="42" fill="#f5deb3"/>
    <rect x="-38" y="42" width="76" height="110" fill="#1a365d"/>
    <rect x="52" y="18" width="130" height="88" fill="#333333"/>
    <rect x="60" y="26" width="114" height="72" fill="#4a90d9"/>
    <rect x="72" y="38" width="45" height="12" fill="#ffd700"/>
    <rect x="72" y="56" width="95" height="9" fill="#ffffff"/>
    <rect x="72" y="70" width="85" height="9" fill="#ffffff"/>
    <rect x="72" y="84" width="75" height="9" fill="#ffffff"/>
  </g>
  
  <!-- Tax questions document -->
  <g transform="translate(480, 190)">
    <rect x="0" y="0" width="370" height="270" fill="#ffffff" stroke="#b45309" stroke-width="3"/>
    <text x="185" y="32" font-family="Arial" font-size="17" fill="#b45309" text-anchor="middle" font-weight="bold">QUESITOS DE AUDITORIA FISCAL</text>
    
    <g transform="translate(22, 65)">
      <rect x="0" y="0" width="326" height="55" fill="#fee2e2" rx="5"/>
      <text x="18" y="22" font-family="Arial" font-size="12" fill="#b91c1c" font-weight="bold">1. CNPJ Compatível?</text>
      <text x="18" y="43" font-family="Arial" font-size="11" fill="#4a5568">Resposta: Não - CNAE incompatível com atividade agrícola</text>
    </g>
    
    <g transform="translate(22, 138)">
      <rect x="0" y="0" width="326" height="55" fill="#fef3c7" rx="5"/>
      <text x="18" y="22" font-family="Arial" font-size="12" fill="#d97706" font-weight="bold">2. Retenção Funrural/PIS/COFINS?</text>
      <text x="18" y="43" font-family="Arial" font-size="11" fill="#4a5568">Resposta: Não - Passivo fiscal a parcelar</text>
    </g>
    
    <g transform="translate(22, 210)">
      <rect x="0" y="0" width="326" height="55" fill="#d1fae5" rx="5"/>
      <text x="18" y="22" font-family="Arial" font-size="12" fill="#15803d" font-weight="bold">3. Comprovação Reinvestimento?</text>
      <text x="18" y="43" font-family="Arial" font-size="11" fill="#4a5568">Resposta: Sim - Fluxo cruzado apresentado</text>
    </g>
  </g>
  
  <!-- Cooperative president -->
  <g transform="translate(930, 270)">
    <circle cx="0" cy="0" r="38" fill="#f5deb3"/>
    <rect x="-33" y="38" width="66" height="88" fill="#b45309"/>
    <rect x="-55" y="-45" width="88" height="45" fill="#ffffff" stroke="#c0c0c0"/>
    <text x="-11" y="-18" font-family="Arial" font-size="10" fill="#1a365d" text-anchor="middle">Respondendo</text>
  </g>
  
  <!-- Farm records -->
  <g transform="translate(870, 450)">
    <rect x="0" y="0" width="320" height="165" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
    <text x="160" y="28" font-family="Arial" font-size="13" fill="#15803d" text-anchor="middle" font-weight="bold">REGISTROS FAZENDA</text>
    <rect x="22" y="55" width="88" height="24" fill="#d1fae5"/>
    <text x="66" y="72" font-family="Arial" font-size="11" fill="#1a365d" text-anchor="middle">Alface</text>
    <rect x="130" y="55" width="88" height="24" fill="#d1fae5"/>
    <text x="174" y="72" font-family="Arial" font-size="11" fill="#1a365d" text-anchor="middle">R$ 45.000</text>
    <rect x="22" y="90" width="88" height="24" fill="#d1fae5"/>
    <text x="66" y="107" font-family="Arial" font-size="11" fill="#1a365d" text-anchor="middle">Tomate</text>
    <rect x="130" y="90" width="88" height="24" fill="#d1fae5"/>
    <text x="174" y="107" font-family="Arial" font-size="11" fill="#1a365d" text-anchor="middle">R$ 38.000</text>
    <rect x="22" y="125" width="88" height="24" fill="#d1fae5"/>
    <text x="66" y="142" font-family="Arial" font-size="11" fill="#1a365d" text-anchor="middle">Cenoura</text>
    <rect x="130" y="125" width="88" height="24" fill="#d1fae5"/>
    <text x="174" y="142" font-family="Arial" font-size="11" fill="#1a365d" text-anchor="middle">R$ 37.000</text>
  </g>
  
  <!-- Text -->
  <text x="640" y="48" font-family="Arial" font-size="38" font-weight="bold" fill="#1a365d" text-anchor="middle">QUESITOS DE AUDITORIA FISCAL</text>
  <text x="640" y="98" font-family="Arial" font-size="20" fill="#b45309" text-anchor="middle">Receita Federal e TCE - Perguntas e Respostas</text>
</svg>