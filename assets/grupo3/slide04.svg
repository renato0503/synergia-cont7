<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Background -->
  <rect width="1280" height="720" fill="#f8fafc"/>
  
  <!-- Aerial view -->
  <g transform="translate(640, 290)">
    <rect x="-470" y="-270" width="940" height="540" fill="#e2e8f0" stroke="#1a365d" stroke-width="4"/>
    
    <!-- Residential zone -->
    <rect x="-450" y="-250" width="420" height="200" fill="#d4a574" opacity="0.4"/>
    <text x="-240" y="-195" font-family="Arial" font-size="20" fill="#1a365d" text-anchor="middle" font-weight="bold">ZONA RESIDENCIAL</text>
    <text x="-240" y="-168" font-family="Arial" font-size="13" fill="#4a5568" text-anchor="middle">Comodato - Moradia</text>
    
    <!-- Fence -->
    <line x1="-30" y1="-250" x2="-30" y2="260" stroke="#8b4513" stroke-width="7"/>
    <g fill="#8b4513">
      <rect x="-38" y="-240" width="12" height="22"/>
      <rect x="-38" y="-165" width="12" height="22"/>
      <rect x="-38" y="-90" width="12" height="22"/>
      <rect x="-38" y="-15" width="12" height="22"/>
      <rect x="-38" y="60" width="12" height="22"/>
      <rect x="-38" y="135" width="12" height="22"/>
      <rect x="-38" y="210" width="12" height="22"/>
    </g>
    
    <!-- Agricultural zone -->
    <rect x="-20" y="-250" width="480" height="500" fill="#228b22" opacity="0.4"/>
    <text x="220" y="-195" font-family="Arial" font-size="20" fill="#1a365d" text-anchor="middle" font-weight="bold">ZONA DE PRODUÇÃO</text>
    <text x="220" y="-168" font-family="Arial" font-size="13" fill="#4a5568" text-anchor="middle">Parceria - Lavoura</text>
    
    <!-- Houses -->
    <g fill="#d4a574">
      <rect x="-420" y="-110" width="55" height="45"/>
      <polygon points="-420,-110 -392,-145 -365,-110"/>
      <rect x="-340" y="-100" width="55" height="45"/>
      <polygon points="-340,-100 -312,-135 -285,-100"/>
      <rect x="-260" y="-105" width="55" height="45"/>
      <polygon points="-260,-105 -232,-140 -205,-105"/>
      <rect x="-420" y="-35" width="55" height="45"/>
      <rect x="-340" y="-30" width="55" height="45"/>
      <rect x="-260" y="-25" width="55" height="45"/>
    </g>
    
    <!-- Crop rows -->
    <g fill="#2d8b2d" opacity="0.6">
      <rect x="60" y="-110" width="380" height="18"/>
      <rect x="60" y="-75" width="380" height="18"/>
      <rect x="60" y="-40" width="380" height="18"/>
      <rect x="60" y="-5" width="380" height="18"/>
      <rect x="60" y="30" width="380" height="18"/>
      <rect x="60" y="65" width="380" height="18"/>
      <rect x="60" y="100" width="380" height="18"/>
      <rect x="60" y="135" width="380" height="18"/>
      <rect x="60" y="170" width="380" height="18"/>
      <rect x="60" y="205" width="380" height="18"/>
    </g>
  </g>
  
  <!-- Master plan -->
  <g transform="translate(80, 90)">
    <rect x="0" y="0" width="220" height="165" fill="#ffffff" stroke="#1a365d" stroke-width="2"/>
    <text x="110" y="32" font-family="Arial" font-size="13" fill="#1a365d" text-anchor="middle" font-weight="bold">PROJETO DE</text>
    <text x="110" y="55" font-family="Arial" font-size="13" fill="#1a365d" text-anchor="middle" font-weight="bold">PARCELAMENTO</text>
    <line x1="22" y1="72" x2="198" y2="72" stroke="#c0c0c0"/>
    <text x="22" y="98" font-family="Arial" font-size="11" fill="#4a5568">Lei 9.785/99</text>
    <text x="22" y="125" font-family="Arial" font-size="11" fill="#15803d">Delimitação formal</text>
    <text x="22" y="148" font-family="Arial" font-size="11" fill="#4a5568">da zona urbana</text>
  </g>
  
  <!-- Surveyor -->
  <g transform="translate(1060, 520)">
    <circle cx="0" cy="-42" r="28" fill="#f5deb3"/>
    <rect x="-22" y="-14" width="44" height="66" fill="#b45309"/>
    <rect x="28" y="0" width="40" height="50" fill="#333333"/>
    <rect x="34" y="6" width="28" height="22" fill="#4ade80"/>
  </g>
  
  <!-- Contract info -->
  <g transform="translate(700, 610)">
    <rect x="0" y="0" width="520" height="75" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" rx="10"/>
    <text x="260" y="28" font-family="Arial" font-size="13" fill="#d97706" text-anchor="middle" font-weight="bold">CONTRATO MISTO PROPOSTO</text>
    <text x="260" y="55" font-family="Arial" font-size="12" fill="#4a5568" text-anchor="middle">Parte social (comodato) + Parte produtiva (parceria)</text>
  </g>
  
  <!-- Text -->
  <text x="640" y="48" font-family="Arial" font-size="38" font-weight="bold" fill="#1a365d" text-anchor="middle">ZONEAMENTO INTERNO</text>
  <text x="640" y="98" font-family="Arial" font-size="20" fill="#b45309" text-anchor="middle">Delimitação Física - Vila vs. Lavoura</text>
</svg>