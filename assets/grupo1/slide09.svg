<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Background -->
  <rect x="0" y="280" width="1280" height="440" fill="#f5f0dc"/>
  <rect width="1280" height="720" fill="#1a365d"/>
  
  <!-- Judge bench -->
  <g transform="translate(640, 180)">
    <rect x="-280" y="0" width="560" height="170" fill="#5c3d2e"/>
    <rect x="-260" y="-25" width="520" height="35" fill="#6b5344"/>
    <rect x="-110" y="-95" width="220" height="115" fill="#3d2817"/>
    <rect x="-90" y="-108" width="180" height="22" fill="#4a3728"/>
  </g>
  
  <!-- Gavel -->
  <g transform="translate(640, 155)">
    <rect x="-9" y="70" width="18" height="95" fill="#5c3d2e"/>
    <rect x="-55" y="35" width="110" height="55" rx="8" fill="#8b7355"/>
    <rect x="-48" y="40" width="96" height="45" rx="5" fill="#6b5344"/>
  </g>
  
  <!-- Lawyer presenting -->
  <g transform="translate(280, 240)">
    <rect x="-90" y="-55" width="65" height="135" fill="#1a365d"/>
    <circle cx="-58" cy="-90" r="28" fill="#f5deb3"/>
    <rect x="22" y="-90" width="220" height="170" fill="#333333"/>
    <rect x="35" y="-78" width="195" height="145" fill="#4a90d9"/>
    <rect x="55" y="-55" width="45" height="70" fill="#10b981"/>
    <rect x="115" y="-45" width="45" height="50" fill="#f59e0b"/>
    <rect x="175" y="-50" width="45" height="55" fill="#b91c1c"/>
  </g>
  
  <!-- Audience -->
  <g transform="translate(130, 450)">
    <circle cx="0" cy="0" r="28" fill="#f5deb3"/>
    <rect x="-23" y="28" width="46" height="58" fill="#1a365d"/>
  </g>
  <g transform="translate(230, 460)">
    <circle cx="0" cy="0" r="26" fill="#f5deb3"/>
    <rect x="-21" y="26" width="42" height="54" fill="#2d3748"/>
  </g>
  <g transform="translate(920, 450)">
    <circle cx="0" cy="0" r="28" fill="#f5deb3"/>
    <rect x="-23" y="28" width="46" height="58" fill="#1a365d"/>
  </g>
  <g transform="translate(1020, 455)">
    <circle cx="0" cy="0" r="27" fill="#f5deb3"/>
    <rect x="-22" y="27" width="44" height="56" fill="#2d3748"/>
  </g>
  
  <!-- Question boxes -->
  <g transform="translate(100, 130)">
    <rect x="0" y="0" width="220" height="90" fill="#ffffff" stroke="#1a365d" stroke-width="2" rx="10"/>
    <text x="110" y="28" font-family="Arial" font-size="13" fill="#1a365d" text-anchor="middle" font-weight="bold">QUESITO 01</text>
    <text x="110" y="55" font-family="Arial" font-size="11" fill="#4a5568" text-anchor="middle">Quantificação Material</text>
    <text x="110" y="75" font-family="Arial" font-size="10" fill="#b91c1c" text-anchor="middle">Sacos de cimento desviados?</text>
  </g>
  <g transform="translate(370, 90)">
    <rect x="0" y="0" width="220" height="90" fill="#ffffff" stroke="#b91c1c" stroke-width="2" rx="10"/>
    <text x="110" y="28" font-family="Arial" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="bold">QUESITO 02</text>
    <text x="110" y="55" font-family="Arial" font-size="11" fill="#4a5568" text-anchor="middle">Desvio Físico</text>
    <text x="110" y="75" font-family="Arial" font-size="10" fill="#b91c1c" text-anchor="middle">Material para habitação ou comercial?</text>
  </g>
  <g transform="translate(640, 110)">
    <rect x="0" y="0" width="220" height="90" fill="#ffffff" stroke="#1a365d" stroke-width="2" rx="10"/>
    <text x="110" y="28" font-family="Arial" font-size="13" fill="#1a365d" text-anchor="middle" font-weight="bold">QUESITO 03</text>
    <text x="110" y="55" font-family="Arial" font-size="11" fill="#4a5568" text-anchor="middle">Mistura Patrimonial</text>
    <text x="110" y="75" font-family="Arial" font-size="10" fill="#4a5568" text-anchor="middle">Proporção público/privado?</text>
  </g>
  
  <!-- Brazilian flag -->
  <g transform="translate(1160, 50)">
    <rect x="0" y="0" width="90" height="68" fill="#009c3b"/>
    <rect x="30" y="17" width="34" height="34" fill="#ffdf00"/>
    <circle cx="47" cy="34" r="10" fill="#002776"/>
  </g>
  
  <!-- Text -->
  <text x="640" y="45" font-family="Arial" font-size="36" font-weight="bold" fill="#1a365d" text-anchor="middle">QUESITOS TÉCNICOS DO JUIZ</text>
  <text x="640" y="90" font-family="Arial" font-size="20" fill="#4a5568" text-anchor="middle">Respostas Técnicas para Esclarecer o Crime Financeiro</text>
</svg>