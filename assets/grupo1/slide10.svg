<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Background -->
  <rect width="1280" height="720" fill="#f8fafc"/>
  
  <!-- Whiteboard -->
  <g transform="translate(80, 50)">
    <rect x="0" y="0" width="550" height="380" fill="#ffffff" stroke="#c0c0c0" stroke-width="2"/>
    <text x="275" y="35" font-family="Arial" font-size="20" fill="#1a365d" text-anchor="middle" font-weight="bold">LAUDO PERICIAL - ACHADOS</text>
    
    <!-- Evidence boxes -->
    <rect x="30" y="60" width="140" height="95" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="100" y="88" font-family="Arial" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="bold">NFe #12345</text>
    <text x="100" y="112" font-family="Arial" font-size="11" fill="#4a5568" text-anchor="middle">300 Sacos cimento</text>
    <text x="100" y="135" font-family="Arial" font-size="12" fill="#1a365d" text-anchor="middle">R$ 45.000,00</text>
    
    <rect x="200" y="60" width="140" height="95" fill="#fff7ed" stroke="#f59e0b"/>
    <text x="270" y="88" font-family="Arial" font-size="12" fill="#d97706" text-anchor="middle" font-weight="bold">BARRACÃO</text>
    <text x="270" y="112" font-family="Arial" font-size="11" fill="#4a5568" text-anchor="middle">Cimento encontrado</text>
    <text x="270" y="135" font-family="Arial" font-size="11" fill="#d97706" text-anchor="middle">(uso comercial)</text>
    
    <rect x="370" y="60" width="140" height="95" fill="#f0fdf4" stroke="#10b981"/>
    <text x="440" y="88" font-family="Arial" font-size="12" fill="#10b981" text-anchor="middle" font-weight="bold">CASAS</text>
    <text x="440" y="112" font-family="Arial" font-size="11" fill="#4a5568" text-anchor="middle">Cimento em falta</text>
    <text x="440" y="135" font-family="Arial" font-size="11" fill="#10b981" text-anchor="middle">1 unidade perdida</text>
    
    <!-- Connection lines -->
    <line x1="170" y1="108" x2="200" y2="108" stroke="#b91c1c" stroke-width="3"/>
    <line x1="340" y1="108" x2="370" y2="108" stroke="#b91c1c" stroke-width="3"/>
    
    <!-- Calculation box -->
    <rect x="30" y="185" width="480" height="115" fill="#1e293b"/>
    <text x="270" y="215" font-family="Arial" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">CÁLCULO DO PREJUÍZO</text>
    <text x="70" y="250" font-family="monospace" font-size="14" fill="#4ade80">300 sacos × R$ 150,00 = R$ 45.000,00</text>
    <text x="70" y="285" font-family="Arial" font-size="13" fill="#fca5a5">= 1 unidade habitacional perdida</text>
    
    <!-- Impact stamp -->
    <rect x="330" y="235" width="160" height="55" fill="#b91c1c" rx="5"/>
    <text x="410" y="262" font-family="Arial" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">IMPACTO</text>
    <text x="410" y="283" font-family="Arial" font-size="12" fill="#ffd700" text-anchor="middle">R$ 45.000,00</text>
  </g>
  
  <!-- Photos comparison -->
  <g transform="translate(700, 70)">
    <rect x="0" y="0" width="260" height="190" fill="#ffffff" stroke="#c0c0c0" stroke-width="2"/>
    <rect x="20" y="20" width="220" height="130" fill="#d4d4d4"/>
    <rect x="60" y="55" width="90" height="80" fill="#a0a0a0"/>
    <text x="130" y="115" font-family="Arial" font-size="13" fill="#1a365d" text-anchor="middle">Barracão Comercial</text>
    <text x="130" y="175" font-family="Arial" font-size="12" fill="#b91c1c" text-anchor="middle">CIMENTO ENCONTRADO</text>
  </g>
  <g transform="translate(1000, 70)">
    <rect x="0" y="0" width="260" height="190" fill="#ffffff" stroke="#c0c0c0" stroke-width="2"/>
    <rect x="20" y="20" width="220" height="130" fill="#d4d4d4"/>
    <g fill="#d4a574">
      <polygon points="80,105 115,60 150,105"/>
      <rect x="90" y="105" width="45" height="40" fill="#c4956a"/>
    </g>
    <text x="130" y="115" font-family="Arial" font-size="13" fill="#1a365d" text-anchor="middle">Casas em Construção</text>
    <text x="130" y="175" font-family="Arial" font-size="12" fill="#f59e0b" text-anchor="middle">CIMENTO EM FALTA</text>
  </g>
  
  <!-- Investigation report -->
  <g transform="translate(700, 300)">
    <rect x="0" y="0" width="560" height="360" fill="#1e293b"/>
    <rect x="0" y="0" width="560" height="45" fill="#334155"/>
    <text x="280" y="30" font-family="Arial" font-size="15" fill="#ffffff" text-anchor="middle">INVESTIGAÇÃO CONCLUÍDA - RELATÓRIO FINAL</text>
    
    <!-- Coffee cups -->
    <g transform="translate(90, 85)">
      <ellipse cx="0" cy="35" rx="28" ry="12" fill="#ffffff"/>
      <rect x="-28" y="15" width="56" height="35" fill="#ffffff"/>
      <path d="M28,25 Q48,32 28,42" fill="none" stroke="#ffffff" stroke-width="5"/>
    </g>
    <g transform="translate(200, 95)">
      <ellipse cx="0" cy="30" rx="22" ry="9" fill="#87ceeb"/>
      <rect x="-22" y="14" width="44" height="28" fill="#87ceeb"/>
    </g>
    
    <!-- Red ink calculations -->
    <rect x="310" y="80" width="220" height="165" fill="#ffffff"/>
    <line x1="325" y1="105" x2="515" y2="105" stroke="#b91c1c" stroke-width="2"/>
    <line x1="325" y1="140" x2="495" y2="140" stroke="#b91c1c" stroke-width="1"/>
    <line x1="325" y1="165" x2="505" y2="165" stroke="#b91c1c" stroke-width="1"/>
    <line x1="325" y1="190" x2="485" y2="190" stroke="#b91c1c" stroke-width="1"/>
    <text x="390" y="235" font-family="Arial" font-size="13" fill="#b91c1c" text-anchor="middle">CÁLCULOS EM VERMELHO</text>
    
    <!-- Forensic stamp -->
    <g transform="translate(430, 280)">
      <circle cx="0" cy="0" r="65" fill="none" stroke="#b91c1c" stroke-width="3"/>
      <text x="0" y="-15" font-family="Arial" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="bold">LAUDO</text>
      <text x="0" y="5" font-family="Arial" font-size="11" fill="#b91c1c" text-anchor="middle">PERICIAL</text>
      <text x="0" y="25" font-family="Arial" font-size="9" fill="#b91c1c" text-anchor="middle">CONCLUÍDO</text>
    </g>
  </g>
  
  <!-- Text -->
  <text x="640" y="38" font-family="Arial" font-size="36" font-weight="bold" fill="#1a365d" text-anchor="middle">ACHADOS DO LAUDO SIMULADO</text>
  
  <!-- Final note -->
  <g transform="translate(80, 680)">
    <rect x="0" y="0" width="1120" height="38" fill="#fee2e2" stroke="#b91c1c" rx="5"/>
    <text x="560" y="25" font-family="Arial" font-size="15" fill="#b91c1c" text-anchor="middle" font-weight="bold">PARECER: Inviável aprovação | TCE recomendada</text>
  </g>
</svg>