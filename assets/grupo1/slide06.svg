<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="cityhall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="100%" stop-color="#2d3748"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1280" height="720" fill="#e2e8f0"/>
  
  <!-- City Hall Building -->
  <g transform="translate(50, 180)">
    <rect x="0" y="0" width="320" height="280" fill="url(#cityhall)"/>
    <rect x="25" y="35" width="90" height="70" fill="#87ceeb" opacity="0.6"/>
    <rect x="135" y="35" width="90" height="70" fill="#87ceeb" opacity="0.6"/>
    <rect x="245" y="35" width="55" height="70" fill="#87ceeb" opacity="0.6"/>
    <rect x="25" y="125" width="90" height="70" fill="#87ceeb" opacity="0.6"/>
    <rect x="135" y="125" width="90" height="70" fill="#87ceeb" opacity="0.6"/>
    <rect x="245" y="125" width="55" height="70" fill="#87ceeb" opacity="0.6"/>
    <rect x="15" y="0" width="22" height="280" fill="#718096"/>
    <rect x="115" y="0" width="22" height="280" fill="#718096"/>
    <rect x="215" y="0" width="22" height="280" fill="#718096"/>
    <rect x="285" y="0" width="22" height="280" fill="#718096"/>
    <rect x="-20" y="280" width="360" height="25" fill="#a0aec0"/>
    <rect x="-30" y="305" width="380" height="25" fill="#b0b8c0"/>
    <text x="160" y="-15" font-family="Arial" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">PREFEITURA MUNICIPAL</text>
    <text x="160" y="340" font-family="Arial" font-size="14" fill="#1a365d" text-anchor="middle">Várzea Grande - MT</text>
  </g>
  
  <!-- Money bag -->
  <g transform="translate(480, 150)">
    <ellipse cx="0" cy="45" rx="40" ry="30" fill="#c0c0c0"/>
    <rect x="-30" y="10" width="60" height="70" rx="10" fill="#d4af37"/>
    <text x="0" y="60" font-family="Arial" font-size="20" fill="#1a365d" text-anchor="middle" font-weight="bold">R$</text>
    <path d="M-12,5 Q0,-18 12,5" fill="none" stroke="#d4af37" stroke-width="4"/>
  </g>
  
  <!-- Arrow showing diversion -->
  <path d="M530,190 Q650,150 720,280" fill="none" stroke="#b91c1c" stroke-width="5" stroke-dasharray="12,6"/>
  <polygon points="720,280 700,268 715,255" fill="#b91c1c"/>
  
  <!-- Commercial warehouse (wrong destination) -->
  <g transform="translate(750, 260)">
    <rect x="0" y="0" width="220" height="170" fill="#a0a0a0"/>
    <polygon points="0,0 110,-55 220,0" fill="#696969"/>
    <rect x="80" y="65" width="65" height="105" fill="#5c3d2e"/>
    <text x="110" y="-15" font-family="Arial" font-size="16" fill="#b91c1c" text-anchor="middle" font-weight="bold">BARRACÃO COMERCIAL</text>
    <rect x="55" y="-70" width="110" height="45" fill="#b91c1c" rx="5"/>
    <text x="110" y="-38" font-family="Arial" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">DESVIO!</text>
  </g>
  
  <!-- Cement bags -->
  <g transform="translate(800, 390)">
    <rect x="0" y="0" width="45" height="35" fill="#c0c0c0"/>
    <text x="22" y="22" font-family="Arial" font-size="9" fill="#1a365d" text-anchor="middle">50kg</text>
    <rect x="55" y="5" width="45" height="35" fill="#c0c0c0"/>
    <text x="77" y="27" font-family="Arial" font-size="9" fill="#1a365d" text-anchor="middle">50kg</text>
    <rect x="110" y="0" width="45" height="35" fill="#c0c0c0"/>
    <text x="132" y="22" font-family="Arial" font-size="9" fill="#1a365d" text-anchor="middle">50kg</text>
  </g>
  <text x="860" y="450" font-family="Arial" font-size="13" fill="#b91c1c" text-anchor="middle">Cimento público desviado</text>
  
  <!-- Mayor at desk with LRF book -->
  <g transform="translate(1050, 320)">
    <rect x="-70" y="60" width="170" height="100" fill="#5c3d2e"/>
    <circle cx="0" cy="0" r="35" fill="#f5deb3"/>
    <rect x="-28" y="35" width="56" height="80" fill="#1a365d"/>
    <rect x="70" y="45" width="90" height="70" fill="#b91c1c"/>
    <text x="115" y="75" font-family="Arial" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">LRF</text>
    <text x="115" y="95" font-family="Arial" font-size="10" fill="#ffffff" text-anchor="middle">Art. 22, 23, 70</text>
  </g>
  
  <!-- Red alert stamp -->
  <g transform="translate(1080, 540)">
    <rect x="-90" y="-35" width="180" height="70" fill="none" stroke="#b91c1c" stroke-width="5" rx="8" transform="rotate(-12)"/>
    <text x="0" y="-5" font-family="Arial" font-size="22" fill="#b91c1c" text-anchor="middle" font-weight="bold" transform="rotate(-12)">IMPROBIDADE</text>
    <text x="0" y="20" font-family="Arial" font-size="16" fill="#b91c1c" text-anchor="middle" transform="rotate(-12)">ADMINISTRATIVA</text>
  </g>
  
  <!-- Audit documents -->
  <g transform="translate(850, 500)">
    <rect x="0" y="0" width="140" height="90" fill="#ffffff" stroke="#c0c0c0"/>
    <line x1="15" y1="22" x2="125" y2="22" stroke="#333"/>
    <line x1="15" y1="40" x2="110" y2="40" stroke="#333"/>
    <line x1="15" y1="58" x2="120" y2="58" stroke="#333"/>
    <line x1="15" y1="76" x2="95" y2="76" stroke="#333"/>
    <rect x="10" y="12" width="120" height="6" fill="#b91c1c"/>
  </g>
  
  <!-- Info box -->
  <g transform="translate(400, 550)">
    <rect x="0" y="0" width="500" height="100" fill="#ffffff" stroke="#b91c1c" stroke-width="2" rx="10"/>
    <text x="250" y="30" font-family="Arial" font-size="16" fill="#b91c1c" text-anchor="middle" font-weight="bold">DESVIO DE FINALIDADE CONFIGURADO</text>
    <text x="250" y="60" font-family="Arial" font-size="14" fill="#1a365d" text-anchor="middle">Verba pública (moradia) → Material construção → Barracão comercial</text>
    <text x="250" y="85" font-family="Arial" font-size="12" fill="#4a5568" text-anchor="middle">Fere Arts. 22, 23 e 70 da Lei de Responsabilidade Fiscal</text>
  </g>
  
  <!-- Text -->
  <text x="640" y="55" font-family="Arial" font-size="36" font-weight="bold" fill="#1a365d" text-anchor="middle">A LRF E O DESVIO DE FINALIDADE</text>
  <text x="640" y="100" font-family="Arial" font-size="20" fill="#4a5568" text-anchor="middle">Lei 8.429/92 - Art. 10 - Improbidade Administrativa</text>
</svg>