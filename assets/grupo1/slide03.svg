<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Background -->
  <rect width="1280" height="720" fill="#f5f0e6"/>
  
  <!-- Bookshelf -->
  <rect x="50" y="80" width="220" height="480" fill="#5c3d2e"/>
  <g fill="#8b7355">
    <rect x="60" y="100" width="200" height="40"/>
    <rect x="60" y="160" width="200" height="40"/>
    <rect x="60" y="220" width="200" height="40"/>
    <rect x="60" y="280" width="200" height="40"/>
    <rect x="60" y="340" width="200" height="40"/>
    <rect x="60" y="400" width="200" height="40"/>
    <rect x="60" y="460" width="200" height="40"/>
  </g>
  <text x="160" y="130" font-family="serif" font-size="14" fill="#ffd700">DIREITO</text>
  <text x="160" y="170" font-family="serif" font-size="14" fill="#ffd700">CÓDIGO CIVIL</text>
  
  <!-- Desk -->
  <rect x="300" y="400" width="700" height="200" fill="#8b7355"/>
  <rect x="300" y="390" width="700" height="20" fill="#6b5344"/>
  
  <!-- Contract document -->
  <g transform="translate(400, 280)">
    <rect x="0" y="0" width="320" height="220" fill="#fffef5" stroke="#c0c0c0" stroke-width="2"/>
    <text x="160" y="35" font-family="Arial" font-size="18" fill="#1a365d" text-anchor="middle" font-weight="bold">CONTRATO DE COMODATO</text>
    <line x1="30" y1="55" x2="290" y2="55" stroke="#c0c0c0"/>
    <text x="30" y="80" font-family="Arial" font-size="12" fill="#4a5568">Proprietário: INCRA / Herdeiros</text>
    <text x="30" y="105" font-family="Arial" font-size="12" fill="#4a5568">Recebedor: Cooperativa Terra Solidária</text>
    <text x="30" y="130" font-family="Arial" font-size="12" fill="#4a5568">Objeto: 500 hectares - Pai André</text>
    <text x="30" y="155" font-family="Arial" font-size="12" fill="#4a5568">Finalidade: Moradia e Agricultura</text>
    <rect x="30" y="170" width="260" height="35" fill="#fef3c7"/>
    <text x="160" y="195" font-family="Arial" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="bold">ART. 579 CC - Empréstimo Gratuito</text>
  </g>
  
  <!-- Two hands signing -->
  <g transform="translate(780, 400)">
    <rect x="0" y="0" width="180" height="100" fill="#ffffff" stroke="#c0c0c0"/>
    <path d="M30,90 Q45,50 70,75 L90,88" fill="none" stroke="#f5deb3" stroke-width="14" stroke-linecap="round"/>
    <path d="M150,90 Q135,50 110,75 L90,88" fill="none" stroke="#f5deb3" stroke-width="14" stroke-linecap="round"/>
    <line x1="85" y1="75" x2="95" y2="85" stroke="#1a365d" stroke-width="4"/>
    <polygon points="95,85 108,82 108,88" fill="#1a365d"/>
  </g>
  
  <!-- Gavel -->
  <g transform="translate(1000, 320)">
    <rect x="0" y="60" width="15" height="90" fill="#5c3d2e"/>
    <rect x="-35" y="25" width="85" height="45" rx="5" fill="#8b7355"/>
    <rect x="-30" y="30" width="75" height="35" rx="3" fill="#6b5344"/>
  </g>
  
  <!-- INCRA stamp -->
  <g transform="translate(1050, 480)">
    <circle cx="0" cy="0" r="55" fill="none" stroke="#b91c1c" stroke-width="3"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#b91c1c" stroke-width="2"/>
    <text x="0" y="-10" font-family="Arial" font-size="14" fill="#b91c1c" text-anchor="middle" font-weight="bold">INCRA</text>
    <text x="0" y="8" font-family="Arial" font-size="9" fill="#b91c1c" text-anchor="middle">INSTITUTO</text>
    <text x="0" y="20" font-family="Arial" font-size="9" fill="#b91c1c" text-anchor="middle">NACIONAL</text>
  </g>
  
  <!-- Lawyer -->
  <g transform="translate(1150, 200)">
    <circle cx="0" cy="0" r="35" fill="#f5deb3"/>
    <rect x="-30" y="35" width="60" height="100" fill="#1a365d"/>
    <polygon points="0,40 -10,55 0,90 10,55" fill="#b91c1c"/>
  </g>
  
  <!-- Info box -->
  <g transform="translate(880, 100)">
    <rect x="0" y="0" width="280" height="180" fill="#ffffff" stroke="#b91c1c" stroke-width="2" rx="10"/>
    <text x="140" y="30" font-family="Arial" font-size="14" fill="#b91c1c" text-anchor="middle" font-weight="bold">IMPLICAÇÕES</text>
    <line x1="20" y1="50" x2="260" y2="50" stroke="#c0c0c0"/>
    <text x="20" y="75" font-family="Arial" font-size="12" fill="#1a365d">• Posse Precária e Detentória</text>
    <text x="20" y="100" font-family="Arial" font-size="12" fill="#1a365d">• Sem Direito Real de Propriedade</text>
    <text x="20" y="125" font-family="Arial" font-size="12" fill="#1a365d">• Isenção de ITR sobre Cooperativa</text>
    <text x="20" y="150" font-family="Arial" font-size="12" fill="#1a365d">• Sem Exploração Econômica Lucrativa</text>
  </g>
  
  <!-- Text -->
  <text x="640" y="60" font-family="Arial" font-size="36" font-weight="bold" fill="#1a365d" text-anchor="middle">A NATUREZA JURÍDICA: COMODATO</text>
  <text x="640" y="105" font-family="Arial" font-size="20" fill="#4a5568" text-anchor="middle">Art. 579 do Código Civil - Empréstimo Gratuito de Coisa Não Fungível</text>
</svg>