<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Background - office -->
  <rect width="1280" height="720" fill="#f1f5f9"/>
  
  <!-- Government office background -->
  <rect x="0" y="0" width="640" height="720" fill="#e2e8f0"/>
  
  <!-- Window -->
  <rect x="50" y="50" width="220" height="170" fill="#87ceeb" opacity="0.5"/>
  <rect x="50" y="50" width="220" height="170" fill="none" stroke="#718096" stroke-width="4"/>
  <line x1="160" y1="50" x2="160" y2="220" stroke="#718096" stroke-width="2"/>
  <line x1="50" y1="135" x2="270" y2="135" stroke="#718096" stroke-width="2"/>
  
  <!-- Treasury seal -->
  <g transform="translate(520, 110)">
    <circle cx="0" cy="0" r="55" fill="#d4af37"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#1a365d" stroke-width="2"/>
    <text x="0" y="-5" font-family="Arial" font-size="12" fill="#1a365d" text-anchor="middle" font-weight="bold">TESOURO</text>
    <text x="0" y="12" font-family="Arial" font-size="10" fill="#1a365d" text-anchor="middle">nacional</text>
  </g>
  
  <!-- Accountant at desk -->
  <g transform="translate(200, 280)">
    <rect x="-90" y="90" width="220" height="120" fill="#8b7355"/>
    <rect x="-55" y="20" width="110" height="75" fill="#333333"/>
    <rect x="-48" y="27" width="96" height="58" fill="#4a90d9"/>
    <rect x="-45" y="95" width="90" height="12" fill="#666666"/>
    <circle cx="0" cy="-30" r="38" fill="#f5deb3"/>
    <rect x="-33" y="8" width="66" height="90" fill="#1a365d"/>
  </g>
  
  <!-- MCASP book -->
  <g transform="translate(80, 430)">
    <rect x="0" y="0" width="130" height="90" fill="#1a365d"/>
    <rect x="8" y="8" width="114" height="74" fill="#2d3748"/>
    <text x="65" y="40" font-family="Arial" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">MCASP</text>
    <text x="65" y="62" font-family="Arial" font-size="12" fill="#94a3b8" text-anchor="middle">10ª Edição</text>
  </g>
  
  <!-- Houses under construction -->
  <g transform="translate(420, 430)">
    <rect x="0" y="55" width="90" height="70" fill="#d4a574"/>
    <polygon points="0,55 45,10 90,55" fill="#8b4513"/>
    <rect x="35" y="85" width="22" height="40" fill="#5c3d2e"/>
    <rect x="110" y="65" width="90" height="70" fill="#c4956a"/>
    <polygon points="110,65 155,20 200,65" fill="#8b4513"/>
    <rect x="230" y="50" width="90" height="70" fill="#d4a574"/>
    <polygon points="230,50 275,5 320,50" fill="#8b4513"/>
  </g>
  
  <!-- Balance sheet diagram -->
  <g transform="translate(750, 80)">
    <rect x="0" y="0" width="480" height="320" fill="#ffffff" stroke="#1a365d" stroke-width="2"/>
    <text x="240" y="30" font-family="Arial" font-size="18" fill="#1a365d" text-anchor="middle" font-weight="bold">ATIVO IMOBILIZADO - MCASP</text>
    
    <!-- Asset column -->
    <rect x="30" y="60" width="190" height="230" fill="#f0fdf4" stroke="#10b981"/>
    <text x="125" y="85" font-family="Arial" font-size="14" fill="#10b981" text-anchor="middle" font-weight="bold">ATIVO</text>
    <text x="45" y="120" font-family="monospace" font-size="12" fill="#1a365d">1.2.3.1.01.00.00</text>
    <text x="45" y="140" font-family="Arial" font-size="11" fill="#4a5568">Imobilizado em Formação</text>
    <text x="45" y="160" font-family="Arial" font-size="11" fill="#10b981">(Durante a obra)</text>
    <text x="45" y="200" font-family="monospace" font-size="12" fill="#1a365d">1.2.3.1.02.00.00</text>
    <text x="45" y="220" font-family="Arial" font-size="11" fill="#4a5568">Imóveis de Uso Comum</text>
    <text x="45" y="240" font-family="Arial" font-size="11" fill="#10b981">(Após entrega)</text>
    
    <!-- Arrow -->
    <path d="M240,175 L280,175" fill="none" stroke="#1a365d" stroke-width="3"/>
    <polygon points="280,175 265,168 265,182" fill="#1a365d"/>
    
    <!-- Public funds column -->
    <rect x="300" y="60" width="150" height="230" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="375" y="85" font-family="Arial" font-size="14" fill="#3b82f6" text-anchor="middle" font-weight="bold">VERBA PÚBLICA</text>
    <rect x="315" y="115" width="120" height="35" fill="#dbeafe"/>
    <text x="375" y="140" font-family="Arial" font-size="11" fill="#1a365d" text-anchor="middle">Convênio Prefeitura</text>
    <rect x="315" y="170" width="120" height="35" fill="#dbeafe"/>
    <text x="375" y="195" font-family="Arial" font-size="11" fill="#1a365d" text-anchor="middle">R$ 5.000.000</text>
    <rect x="315" y="225" width="120" height="35" fill="#fee2e2"/>
    <text x="375" y="250" font-family="Arial" font-size="11" fill="#b91c1c" text-anchor="middle">Centros de Custo</text>
  </g>
  
  <!-- Government software interface -->
  <g transform="translate(780, 450)">
    <rect x="0" y="0" width="420" height="200" fill="#1e293b"/>
    <rect x="12" y="12" width="396" height="32" fill="#334155"/>
    <circle cx="28" cy="28" r="10" fill="#ef4444"/>
    <circle cx="52" cy="28" r="10" fill="#f59e0b"/>
    <circle cx="76" cy="28" r="10" fill="#10b981"/>
    <text x="210" y="34" font-family="Arial" font-size="14" fill="#ffffff" text-anchor="middle">Sistema Contábil Governamental</text>
    <text x="40" y="80" font-family="monospace" font-size="12" fill="#4ade80">> Conta: 1.2.3.1.01.00.00</text>
    <text x="40" y="110" font-family="monospace" font-size="12" fill="#94a3b8">> Convênio: 2025/001</text>
    <text x="40" y="140" font-family="monospace" font-size="12" fill="#94a3b8">> Valor: R$ 4.200.000,00</text>
    <text x="40" y="170" font-family="monospace" font-size="12" fill="#fca5a5">> STATUS: Regular</text>
  </g>
  
  <!-- Text -->
  <text x="640" y="45" font-family="Arial" font-size="36" font-weight="bold" fill="#1a365d" text-anchor="middle">REGISTRO DO ATIVO SOCIAL (MCASP)</text>
  <text x="640" y="90" font-family="Arial" font-size="20" fill="#4a5568" text-anchor="middle">Controle por Centro de Custo | Nota Fiscal com CNPJ do Convênio</text>
</svg>