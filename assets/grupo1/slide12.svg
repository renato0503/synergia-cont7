<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <radialGradient id="spotlight" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1280" height="720" fill="#0f172a"/>
  <rect width="1280" height="720" fill="url(#spotlight)"/>
  
  <!-- Scale of justice -->
  <g transform="translate(640, 100)">
    <rect x="-6" y="0" width="12" height="160" fill="#c0c0c0"/>
    <rect x="-65" y="-12" width="130" height="16" fill="#a0a0a0"/>
    <line x1="-55" y1="4" x2="-55" y2="90" stroke="#c0c0c0" stroke-width="4"/>
    <line x1="55" y1="4" x2="55" y2="90" stroke="#c0c0c0" stroke-width="4"/>
    <path d="M-55,90 Q0,125 55,90" fill="none" stroke="#c0c0c0" stroke-width="4"/>
    <ellipse cx="-55" cy="110" rx="45" ry="22" fill="#d4af37"/>
    <rect x="-75" y="85" width="40" height="55" fill="#d4a574"/>
    <polygon points="-75,85 -55,50 -35,85" fill="#8b4513"/>
    <ellipse cx="55" cy="110" rx="45" ry="22" fill="#d4af37"/>
    <rect x="35" y="75" width="40" height="55" fill="#ffffff"/>
    <line x1="42" y1="92" x2="75" y2="92" stroke="#1a365d"/>
    <line x1="42" y1="105" x2="68" y2="105" stroke="#1a365d"/>
    <circle cx="0" cy="-28" r="22" fill="#b91c1c"/>
  </g>
  
  <!-- Thank you text -->
  <text x="640" y="300" font-family="Georgia, serif" font-size="68" fill="#ffffff" text-anchor="middle" font-weight="bold">MUITO OBRIGADO!</text>
  <text x="640" y="355" font-family="Arial" font-size="26" fill="#94a3b8" text-anchor="middle">Defesa Técnica e Pericial Concluída</text>
  
  <!-- Team box -->
  <g transform="translate(640, 430)">
    <rect x="-220" y="0" width="440" height="220" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" rx="20"/>
    
    <circle cx="0" cy="-70" r="45" fill="#b91c1c"/>
    <text x="0" y="-58" font-family="Arial" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">G1</text>
    <text x="0" y="-38" font-family="Arial" font-size="11" fill="#ffffff" text-anchor="middle">GRUPO 01</text>
    
    <text x="0" y="15" font-family="Arial" font-size="24" fill="#ffffff" text-anchor="middle">Bruna Saggin</text>
    <text x="0" y="55" font-family="Arial" font-size="24" fill="#ffffff" text-anchor="middle">Yorgelis Rojas</text>
    <text x="0" y="95" font-family="Arial" font-size="24" fill="#ffffff" text-anchor="middle">Simone Terena</text>
    
    <line x1="-170" y1="130" x2="170" y2="130" stroke="rgba(255,255,255,0.2)"/>
    
    <text x="0" y="165" font-family="Arial" font-size="14" fill="#94a3b8" text-anchor="middle">Projeto Synergia Cont7 - UNIFACC 2026</text>
    <text x="0" y="192" font-family="Arial" font-size="14" fill="#94a3b8" text-anchor="middle">Orientação: Prof. Renato Rosa</text>
  </g>
  
  <!-- Decorative -->
  <g fill="#d4af37" opacity="0.3">
    <polygon points="100,620 135,560 170,620"/>
    <polygon points="1100,600 1135,540 1170,600"/>
  </g>
  
  <!-- Bottom accent -->
  <rect x="0" y="700" width="1280" height="20" fill="#b91c1c"/>
</svg>