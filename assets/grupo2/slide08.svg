<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Background -->
  <rect width="1280" height="720" fill="#f0fdf4"/>
  
  <!-- Round table -->
  <g transform="translate(640, 290)">
    <ellipse cx="0" cy="55" rx="270" ry="105" fill="#8b7355"/>
    <ellipse cx="0" cy="42" rx="258" ry="95" fill="#a08060"/>
    
    <!-- Mediator -->
    <g transform="translate(0, -130)">
      <circle cx="0" cy="0" r="38" fill="#15803d"/>
      <rect x="-32" y="38" width="64" height="80" fill="#1a365d"/>
      <text x="0" y="10" font-family="Arial" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold">M</text>
    </g>
    
    <!-- Community lawyer -->
    <g transform="translate(-195, -90)">
      <circle cx="0" cy="0" r="30" fill="#f5deb3"/>
      <rect x="-26" y="30" width="52" height="68" fill="#2d3748"/>
      <rect x="-18" y="38" width="36" height="24" fill="#ffffff"/>
    </g>
    
    <!-- Government lawyer -->
    <g transform="translate(195, -90)">
      <circle cx="0" cy="0" r="30" fill="#f5deb3"/>
      <rect x="-26" y="30" width="52" height="68" fill="#1a365d"/>
      <rect x="-18" y="38" width="36" height="24" fill="#ffffff"/>
    </g>
    
    <!-- Census document -->
    <g transform="translate(-380, 30)">
      <rect x="0" y="0" width="110" height="78" fill="#ffffff" stroke="#15803d"/>
      <text x="55" y="22" font-family="Arial" font-size="11" fill="#15803d" text-anchor="middle" font-weight="bold">CENSO AGRO</text>
      <text x="55" y="42" font-family="Arial" font-size="10" fill="#4a5568" text-anchor="middle">IBGE 2017</text>
      <text x="55" y="62" font-family="Arial" font-size="9" fill="#4a5568" text-anchor="middle">Gestão Mista = Regra</text>
    </g>
    
    <!-- Agreement -->
    <g transform="translate(0, 55)">
      <rect x="-70" y="0" width="140" height="90" fill="#ffffff" stroke="#10b981" stroke-width="3"/>
      <text x="0" y="28" font-family="Arial" font-size="11" fill="#10b981" text-anchor="middle" font-weight="bold">CONTRATO</text>
      <text x="0" y="48" font-family="Arial" font-size="11" fill="#10b981" text-anchor="middle">DE MEDIAÇÃO</text>
      <path d="M-45,72 L0,60 L45,72" fill="none" stroke="#10b981" stroke-width="2"/>
    </g>
  </g>
  
  <!-- Documents on wall -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="165" height="110" fill="#ffffff" stroke="#c0c0c0"/>
    <text x="82" y="32" font-family="Arial" font-size="12" fill="#1a365d" text-anchor="middle">Laudo Técnico</text>
    <text x="82" y="55" font-family="Arial" font-size="10" fill="#4a5568" text-anchor="middle">Perícia Contábil</text>
  </g>
  <g transform="translate(300, 80)">
    <rect x="0" y="0" width="165" height="110" fill="#ffffff" stroke="#c0c0c0"/>
    <text x="82" y="32" font-family="Arial" font-size="12" fill="#1a365d" text-anchor="middle">Relatório de Auditoria</text>
    <text x="82" y="55" font-family="Arial" font-size="10" fill="#4a5568" text-anchor="middle">Conformidade</text>
  </g>
  <g transform="translate(160, 220)">
    <rect x="0" y="0" width="165" height="110" fill="#ffffff" stroke="#c0c0c0"/>
    <text x="82" y="32" font-family="Arial" font-size="12" fill="#1a365d" text-anchor="middle">Censo Agro 2017</text>
    <text x="82" y="55" font-family="Arial" font-size="10" fill="#4a5568" text-anchor="middle">IBGE</text>
  </g>
  
  <!-- Key insight -->
  <g transform="translate(800, 500)">
    <rect x="0" y="0" width="420" height="110" fill="#ffffff" stroke="#15803d" stroke-width="3" rx="10"/>
    <text x="210" y="32" font-family="Arial" font-size="15" fill="#15803d" text-anchor="middle" font-weight="bold">DESCOBERTA TÉCNICA</text>
    <line x1="30" y1="52" x2="390" y2="52" stroke="#c0c0c0"/>
    <text x="30" y="80" font-family="Arial" font-size="13" fill="#1a365d">Gestão mista (social + pequena produção) é a REGRA</text>
    <text x="30" y="100" font-family="Arial" font-size="12" fill="#15803d">em assentamentos, não a exceção!</text>
  </g>
  
  <!-- Text -->
  <text x="640" y="48" font-family="Arial" font-size="38" font-weight="bold" fill="#1a365d" text-anchor="middle">MEDIAÇÃO E CONFORMIDADE</text>
  <text x="640" y="98" font-family="Arial" font-size="20" fill="#15803d" text-anchor="middle">Auditoria de Conformidade | Acordo Extrajudicial</text>
</svg>