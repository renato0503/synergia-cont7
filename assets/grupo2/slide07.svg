<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Background -->
  <rect width="1280" height="720" fill="#e2e8f0"/>
  
  <!-- Computer dashboard -->
  <g transform="translate(640, 240)">
    <rect x="-370" y="-160" width="740" height="360" fill="#1e293b" rx="10"/>
    <rect x="-350" y="-140" width="700" height="320" fill="#0f172a"/>
    
    <!-- Header -->
    <rect x="-340" y="-130" width="680" height="45" fill="#334155"/>
    <text x="0" y="-98" font-family="Arial" font-size="17" fill="#ffd700" text-anchor="middle" font-weight="bold">TCE-MT - Tribunal de Contas de Mato Grosso</text>
    <text x="0" y="-80" font-family="Arial" font-size="13" fill="#94a3b8" text-anchor="middle">IN 04/2023 - Indicadores de Gestão</text>
    
    <!-- Charts -->
    <g transform="translate(-300, -30)">
      <rect x="0" y="0" width="190" height="150" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
      <text x="95" y="28" font-family="Arial" font-size="12" fill="#ffffff" text-anchor="middle">EXECUÇÃO FÍSICA vs FINANCEIRA</text>
      <rect x="22" y="50" width="65" height="65" fill="#10b981"/>
      <text x="55" y="95" font-family="Arial" font-size="11" fill="#ffffff" text-anchor="middle">92%</text>
      <rect x="105" y="70" width="65" height="45" fill="#f59e0b"/>
      <text x="137" y="95" font-family="Arial" font-size="11" fill="#ffffff" text-anchor="middle">78%</text>
      <text x="95" y="135" font-family="Arial" font-size="10" fill="#4ade80" text-anchor="middle">✓ Acima 90%</text>
    </g>
    
    <g transform="translate(60, -30)">
      <rect x="0" y="0" width="190" height="150" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
      <text x="95" y="28" font-family="Arial" font-size="12" fill="#ffffff" text-anchor="middle">TRANSPARÊNCIA ATIVA</text>
      <rect x="32" y="55" width="45" height="55" fill="#3b82f6"/>
      <rect x="75" y="55" width="45" height="55" fill="#3b82f6"/>
      <rect x="118" y="55" width="45" height="55" fill="#60a5fa"/>
      <text x="95" y="130" font-family="Arial" font-size="10" fill="#60a5fa" text-anchor="middle">Publicação Mensal</text>
    </g>
    
    <g transform="translate(280, -30)">
      <rect x="0" y="0" width="190" height="150" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
      <text x="95" y="28" font-family="Arial" font-size="12" fill="#ffffff" text-anchor="middle">CONTRAPARTIDA SOCIAL</text>
      <circle cx="55" cy="85" r="22" fill="#8b5cf6"/>
      <circle cx="95" cy="78" r="28" fill="#a78bfa"/>
      <circle cx="135" cy="85" r="22" fill="#8b5cf6"/>
      <text x="95" y="130" font-family="Arial" font-size="10" fill="#a78bfa" text-anchor="middle">Trabalho Voluntário</text>
    </g>
    
    <!-- Progress bar -->
    <g transform="translate(-340, 130)">
      <text x="0" y="0" font-family="Arial" font-size="11" fill="#94a3b8">Correlação Gasto/Obra:</text>
      <rect x="130" y="-12" width="220" height="18" fill="#334155"/>
      <rect x="130" y="-12" width="202" height="18" fill="#4ade80"/>
      <text x="360" y="3" font-family="Arial" font-size="11" fill="#4ade80">92%</text>
    </g>
  </g>
  
  <!-- Accountant -->
  <g transform="translate(160, 490)">
    <circle cx="0" cy="-55" r="32" fill="#f5deb3"/>
    <rect x="-28" y="-23" width="56" height="78" fill="#1a365d"/>
    <rect x="35" y="-45" width="65" height="10" fill="#ffd700" transform="rotate(-30, 35, -45)"/>
  </g>
  
  <!-- Requirements -->
  <g transform="translate(680, 540)">
    <rect x="0" y="0" width="520" height="130" fill="#ffffff" stroke="#1a365d" stroke-width="2" rx="10"/>
    <text x="260" y="28" font-family="Arial" font-size="13" fill="#1a365d" text-anchor="middle" font-weight="bold">REQUISITOS IN 04/2023 TCE-MT</text>
    <line x1="30" y1="48" x2="490" y2="48" stroke="#c0c0c0"/>
    <text x="40" y="75" font-family="Arial" font-size="12" fill="#4a5568">• Nota fiscal com CNPJ do convênio</text>
    <text x="40" y="100" font-family="Arial" font-size="12" fill="#4a5568">• Conta bancária exclusiva</text>
    <text x="290" y="75" font-family="Arial" font-size="12" fill="#4a5568">• Relatório mensal de execução</text>
    <text x="290" y="100" font-family="Arial" font-size="12" fill="#4a5568">• Comprovação de contrapartida</text>
  </g>
  
  <!-- Text -->
  <text x="640" y="48" font-family="Arial" font-size="38" font-weight="bold" fill="#1a365d" text-anchor="middle">INDICADORES DE GESTÃO TCE-MT</text>
  <text x="640" y="98" font-family="Arial" font-size="20" fill="#4a5568" text-anchor="middle">IN 04/2023 - Execução > 90% | Transparência | Contrapartida</text>
</svg>