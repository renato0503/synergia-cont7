<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <radialGradient id="spotlight2" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
  </defs>
  
  <rect width="1280" height="720" fill="#0f172a"/>
  <rect width="1280" height="720" fill="url(#spotlight2)"/>
  
  <!-- Handshake -->
  <g transform="translate(640, 120)">
    <circle cx="0" cy="0" r="65" fill="none" stroke="#15803d" stroke-width="4"/>
    <path d="M-45,12 L-12,22 L25,2 L58,-12" fill="none" stroke="#15803d" stroke-width="9" stroke-linecap="round"/>
    <path d="M-45,12 L-28,-5 L0,18 L35,6" fill="none" stroke="#15803d" stroke-width="9" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="18" fill="#15803d"/>
  </g>
  
  <!-- Thank you -->
  <text x="640" y="290" font-family="Georgia, serif" font-size="68" fill="#ffffff" text-anchor="middle" font-weight="bold">MUITO OBRIGADO!</text>
  <text x="640" y="345" font-family="Arial" font-size="26" fill="#94a3b8" text-anchor="middle">Acordo de Mediação Técnica Concluído</text>
  
  <!-- Team box -->
  <g transform="translate(640, 430)">
    <rect x="-220" y="0" width="440" height="240" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" rx="20"/>
    
    <circle cx="0" cy="-75" r="45" fill="#15803d"/>
    <text x="0" y="-63" font-family="Arial" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">G2</text>
    <text x="0" y="-43" font-family="Arial" font-size="11" fill="#ffffff" text-anchor="middle">GRUPO 02</text>
    
    <text x="0" y="12" font-family="Arial" font-size="23" fill="#ffffff" text-anchor="middle">Sarah Ikegami</text>
    <text x="0" y="52" font-family="Arial" font-size="23" fill="#ffffff" text-anchor="middle">Vinícius</text>
    <text x="0" y="92" font-family="Arial" font-size="23" fill="#ffffff" text-anchor="middle">Alysson Dias</text>
    <text x="0" y="132" font-family="Arial" font-size="23" fill="#ffffff" text-anchor="middle">Edson Junior</text>
    
    <line x1="-170" y1="158" x2="170" y2="158" stroke="rgba(255,255,255,0.2)"/>
    
    <text x="0" y="185" font-family="Arial" font-size="14" fill="#94a3b8" text-anchor="middle">Projeto Synergia Cont7 - UNIFACC 2026</text>
    <text x="0" y="212" font-family="Arial" font-size="14" fill="#94a3b8" text-anchor="middle">Orientação: Prof. Renato Rosa</text>
  </g>
  
  <!-- Decorations -->
  <g fill="#15803d" opacity="0.3">
    <ellipse cx="200" cy="610" rx="110" ry="55"/>
    <ellipse cx="1080" cy="610" rx="110" ry="55"/>
  </g>
  
  <rect x="0" y="700" width="1280" height="20" fill="#15803d"/>
</svg>