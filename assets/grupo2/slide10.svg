<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Background -->
  <rect width="1280" height="720" fill="#f0fdf4"/>
  
  <!-- Main document -->
  <g transform="translate(640, 240)">
    <rect x="-320" y="-160" width="640" height="370" fill="#ffffff" stroke="#15803d" stroke-width="3" rx="20"/>
    <text x="0" y="-110" font-family="Arial" font-size="26" fill="#15803d" text-anchor="middle" font-weight="bold">RECOMENDAÇÕES PERICIAIS</text>
    <text x="0" y="-75" font-family="Arial" font-size="17" fill="#4a5568" text-anchor="middle">Laudo de Conciliação - Focus na Resolução Extrajudicial</text>
    
    <!-- Item 1 -->
    <g transform="translate(-270, -30)">
      <circle cx="32" cy="28" r="22" fill="#15803d"/>
      <path d="M24,28 L30,34 L42,22" fill="none" stroke="#ffffff" stroke-width="3"/>
      <text x="75" y="22" font-family="Arial" font-size="15" fill="#1a365d" font-weight="bold">1. Conversão do Passivo</text>
      <text x="75" y="45" font-family="Arial" font-size="12" fill="#4a5568">Barracão tombado como Ativo Comunitário</text>
    </g>
    
    <!-- Item 2 -->
    <g transform="translate(-270, 50)">
      <circle cx="32" cy="28" r="22" fill="#15803d"/>
      <path d="M24,28 L30,34 L42,22" fill="none" stroke="#ffffff" stroke-width="3"/>
      <text x="75" y="22" font-family="Arial" font-size="15" fill="#1a365d" font-weight="bold">2. Assinatura do TAC</text>
      <text x="75" y="45" font-family="Arial" font-size="12" fill="#4a5568">Aceite imediato dos termos para suspender multa</text>
    </g>
    
    <!-- Item 3 -->
    <g transform="translate(-270, 130)">
      <circle cx="32" cy="28" r="22" fill="#15803d"/>
      <path d="M24,28 L30,34 L42,22" fill="none" stroke="#ffffff" stroke-width="3"/>
      <text x="75" y="22" font-family="Arial" font-size="15" fill="#1a365d" font-weight="bold">3. Prestação de Contas Retroativa</text>
      <text x="75" y="45" font-family="Arial" font-size="12" fill="#4a5568">Organização de notas fiscais por Centro de Custo</text>
    </g>
    
    <!-- Item 4 -->
    <g transform="translate(50, -30)">
      <circle cx="32" cy="28" r="22" fill="#15803d"/>
      <path d="M24,28 L30,34 L42,22" fill="none" stroke="#ffffff" stroke-width="3"/>
      <text x="75" y="22" font-family="Arial" font-size="15" fill="#1a365d" font-weight="bold">4. Monitoramento</text>
      <text x="75" y="45" font-family="Arial" font-size="12" fill="#4a5568">Contratar contador/auditor independente</text>
    </g>
  </g>
  
  <!-- Converted warehouse -->
  <g transform="translate(130, 510)">
    <rect x="0" y="0" width="220" height="130" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
    <text x="110" y="32" font-family="Arial" font-size="13" fill="#15803d" text-anchor="middle" font-weight="bold">BARRACÃO APROVADO</text>
    <rect x="22" y="55" width="176" height="55" fill="#d1fae5"/>
    <text x="110" y="88" font-family="Arial" font-size="12" fill="#1a365d" text-anchor="middle">Ativo Comunitário</text>
  </g>
  
  <!-- TAC signed -->
  <g transform="translate(420, 530)">
    <rect x="0" y="0" width="200" height="110" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
    <text x="100" y="28" font-family="Arial" font-size="12" fill="#15803d" text-anchor="middle" font-weight="bold">TAC ASSINADO</text>
    <line x1="22" y1="48" x2="178" y2="48" stroke="#c0c0c0"/>
    <circle cx="100" cy="82" r="22" fill="#15803d" opacity="0.8"/>
    <text x="100" y="88" font-family="Arial" font-size="10" fill="#ffffff" text-anchor="middle">MP+SEMA</text>
  </g>
  
  <!-- Fine cancelled -->
  <g transform="translate(700, 520)">
    <rect x="0" y="0" width="200" height="110" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <text x="100" y="28" font-family="Arial" font-size="12" fill="#10b981" text-anchor="middle" font-weight="bold">MULTA SUSPENSA</text>
    <line x1="22" y1="48" x2="178" y2="48" stroke="#c0c0c0"/>
    <line x1="32" y1="65" x2="168" y2="98" stroke="#b91c1c" stroke-width="4"/>
    <line x1="168" y1="65" x2="32" y2="98" stroke="#b91c1c" stroke-width="4"/>
  </g>
  
  <!-- Accounting corrected -->
  <g transform="translate(980, 500)">
    <rect x="0" y="0" width="220" height="130" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <text x="110" y="32" font-family="Arial" font-size="12" fill="#3b82f6" text-anchor="middle" font-weight="bold">LIVRO CORRIGIDO</text>
    <rect x="22" y="55" width="176" height="55" fill="#dbeafe"/>
    <text x="110" y="88" font-family="Arial" font-size="11" fill="#1a365d" text-anchor="middle">Centro de Custo Regular</text>
  </g>
  
  <!-- Text -->
  <text x="640" y="48" font-family="Arial" font-size="38" font-weight="bold" fill="#1a365d" text-anchor="middle">RECOMENDAÇÕES PERICIAIS</text>
  <text x="640" y="98" font-family="Arial" font-size="20" fill="#15803d" text-anchor="middle">Foco na Resolução Extrajudicial do Conflito</text>
</svg>