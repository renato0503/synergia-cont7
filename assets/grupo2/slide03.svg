<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Background -->
  <rect width="1280" height="720" fill="#f5f0dc"/>
  
  <!-- Constitution book -->
  <g transform="translate(120, 170)">
    <rect x="0" y="0" width="280" height="360" fill="#1a365d"/>
    <rect x="12" y="12" width="256" height="336" fill="#0f172a"/>
    <text x="140" y="60" font-family="serif" font-size="22" fill="#ffd700" text-anchor="middle" font-weight="bold">CONSTITUIÇÃO</text>
    <text x="140" y="95" font-family="serif" font-size="18" fill="#ffffff" text-anchor="middle">FEDERAL</text>
    <line x1="40" y1="120" x2="240" y2="120" stroke="#ffd700" stroke-width="2"/>
    <text x="140" y="155" font-family="Arial" font-size="15" fill="#ffffff" text-anchor="middle">Art. 186</text>
    <text x="140" y="185" font-family="Arial" font-size="12" fill="#94a3b8" text-anchor="middle">Função Social da</text>
    <text x="140" y="205" font-family="Arial" font-size="12" fill="#94a3b8" text-anchor="middle">Propriedade Rural</text>
    <rect x="30" y="240" width="100" height="75" fill="#ffffff"/>
    <rect x="150" y="240" width="100" height="75" fill="#f0f0f0"/>
  </g>
  
  <!-- Comparison -->
  <g transform="translate(500, 140)">
    <!-- Productive farm -->
    <rect x="0" y="0" width="300" height="220" fill="#ffffff" stroke="#10b981" stroke-width="3"/>
    <text x="150" y="35" font-family="Arial" font-size="15" fill="#10b981" text-anchor="middle" font-weight="bold">PROPRIEDADE PRODUTIVA</text>
    <ellipse cx="150" cy="130" rx="110" ry="65" fill="#4a7c59"/>
    <g fill="#228b22">
      <rect x="85" y="95" width="35" height="55"/>
      <rect x="140" y="88" width="35" height="60"/>
      <rect x="195" y="100" width="35" height="50"/>
    </g>
    <circle cx="265" cy="35" r="22" fill="#10b981"/>
    <path d="M255,35 L263,43 L277,27" fill="none" stroke="#ffffff" stroke-width="3"/>
    
    <line x1="310" y1="0" x2="310" y2="220" stroke="#c0c0c0" stroke-width="2"/>
    
    <!-- Abandoned land -->
    <rect x="320" y="0" width="300" height="220" fill="#ffffff" stroke="#b91c1c" stroke-width="3"/>
    <text x="470" y="35" font-family="Arial" font-size="15" fill="#b91c1c" text-anchor="middle" font-weight="bold">TERRA ABANDONADA</text>
    <ellipse cx="470" cy="130" rx="110" ry="65" fill="#8b7355"/>
    <text x="470" y="140" font-family="Arial" font-size="28" fill="#b91c1c" text-anchor="middle">X</text>
    <circle cx="580" cy="35" r="22" fill="#b91c1c"/>
    <line x1="572" y1="27" x2="588" y2="43" stroke="#ffffff" stroke-width="3"/>
    <line x1="588" y1="27" x2="572" y2="43" stroke="#ffffff" stroke-width="3"/>
  </g>
  
  <!-- Land deed -->
  <g transform="translate(500, 400)">
    <rect x="0" y="0" width="320" height="210" fill="#fff8dc" stroke="#8b7355" stroke-width="2"/>
    <text x="160" y="35" font-family="Arial" font-size="18" fill="#8b7355" text-anchor="middle" font-weight="bold">TERRA DE FUNÇÃO SOCIAL</text>
    <line x1="30" y1="55" x2="290" y2="55" stroke="#8b7355"/>
    <text x="30" y="85" font-family="Arial" font-size="12" fill="#1a365d">Proprietário: Estado/Beneficiários</text>
    <text x="30" y="112" font-family="Arial" font-size="12" fill="#1a365d">Área: 500 hectares</text>
    <text x="30" y="139" font-family="Arial" font-size="12" fill="#1a365d">Uso: Produção + Habitação</text>
    <text x="30" y="175" font-family="Arial" font-size="12" fill="#15803d" font-weight="bold">✓ Cumpre Art. 186 CF/88</text>
  </g>
  
  <!-- Farmer with harvest -->
  <g transform="translate(920, 390)">
    <circle cx="0" cy="-55" r="32" fill="#f5deb3"/>
    <rect x="-27" y="-23" width="54" height="78" fill="#1a365d"/>
    <ellipse cx="0" cy="30" rx="45" ry="22" fill="#8b7355"/>
    <ellipse cx="0" cy="18" rx="38" ry="16" fill="#d4a574"/>
    <circle cx="-18" cy="12" r="12" fill="#228b22"/>
    <circle cx="12" cy="8" r="14" fill="#ff6347"/>
    <circle cx="0" cy="22" r="10" fill="#4169e1"/>
  </g>
  
  <!-- Comparison chart -->
  <g transform="translate(920, 140)">
    <rect x="0" y="0" width="260" height="130" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
    <text x="130" y="28" font-family="Arial" font-size="13" fill="#15803d" text-anchor="middle" font-weight="bold">COMPARATIVO</text>
    <rect x="30" y="50" width="85" height="22" fill="#10b981"/>
    <text x="125" y="67" font-family="Arial" font-size="11" fill="#1a365d">85% Produtividade</text>
    <rect x="30" y="85" width="85" height="22" fill="#b91c1c"/>
    <text x="125" y="102" font-family="Arial" font-size="11" fill="#1a365d">10% Produtividade</text>
  </g>
  
  <!-- Text -->
  <text x="640" y="55" font-family="Arial" font-size="38" font-weight="bold" fill="#1a365d" text-anchor="middle">A FUNÇÃO SOCIAL DA PROPRIEDADE</text>
  <text x="640" y="105" font-family="Arial" font-size="20" fill="#4a5568" text-anchor="middle">Art. 186 CF/88 - Eficiência vs. Abandono</text>
</svg>