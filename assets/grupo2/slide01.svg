<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="horizon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#87ceeb"/>
      <stop offset="50%" stop-color="#98d8aa"/>
      <stop offset="100%" stop-color="#4a7c59"/>
    </linearGradient>
  </defs>
  
  <!-- Sky and horizon -->
  <rect width="1280" height="720" fill="url(#horizon)"/>
  
  <!-- City buildings (left) -->
  <g fill="#4a5568">
    <rect x="30" y="280" width="70" height="170"/>
    <rect x="120" y="250" width="90" height="200"/>
    <rect x="230" y="300" width="60" height="150"/>
  </g>
  <g fill="#87ceeb" opacity="0.5">
    <rect x="45" y="310" width="35" height="35"/>
    <rect x="135" y="285" width="45" height="45"/>
    <rect x="245" y="330" width="30" height="30"/>
  </g>
  
  <!-- Transition zone -->
  <rect x="330" y="360" width="180" height="150" fill="#6b8e23" opacity="0.4"/>
  
  <!-- Farm fields (right) -->
  <ellipse cx="950" cy="500" rx="350" ry="150" fill="#4a7c59"/>
  <ellipse cx="1100" cy="550" rx="280" ry="120" fill="#228b22" opacity="0.5"/>
  
  <!-- Crops -->
  <g fill="#556b2f">
    <rect x="650" y="480" width="25" height="45"/>
    <rect x="700" y="465" width="25" height="55"/>
    <rect x="750" y="475" width="25" height="50"/>
    <rect x="800" y="460" width="25" height="60"/>
  </g>
  
  <!-- Community meeting circle -->
  <g transform="translate(480, 380)">
    <circle cx="0" cy="0" r="90" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="10,5"/>
    <circle cx="0" cy="0" r="35" fill="#15803d"/>
    <rect x="-25" y="35" width="50" height="60" fill="#1a365d"/>
    <text x="0" y="8" font-family="Arial" font-size="18" fill="#ffffff" text-anchor="middle">M</text>
    <circle cx="-75" cy="-45" r="22" fill="#f5deb3"/>
    <circle cx="75" cy="-45" r="22" fill="#f5deb3"/>
    <circle cx="-65" cy="55" r="22" fill="#f5deb3"/>
    <circle cx="65" cy="55" r="22" fill="#f5deb3"/>
  </g>
  
  <!-- Sustainable houses -->
  <g transform="translate(680, 340)">
    <rect x="0" y="0" width="65" height="55" fill="#d4a574"/>
    <polygon points="0,0 32,-28 65,0" fill="#228b22"/>
    <rect x="22" y="28" width="22" height="27" fill="#5c3d2e"/>
  </g>
  <g transform="translate(770, 350)">
    <rect x="0" y="0" width="65" height="55" fill="#c4956a"/>
    <polygon points="0,0 32,-22 65,0" fill="#228b22"/>
  </g>
  <g transform="translate(860, 345)">
    <rect x="0" y="0" width="65" height="55" fill="#d4a574"/>
    <polygon points="0,0 32,-25 65,0" fill="#228b22"/>
  </g>
  
  <!-- Golden hour sun -->
  <circle cx="1150" cy="100" r="65" fill="#ffd700" opacity="0.8"/>
  
  <!-- Text -->
  <text x="640" y="75" font-family="Arial" font-size="38" font-weight="bold" fill="#1a365d" text-anchor="middle">AUDITORIA E MEDIAÇÃO SOCIOAMBIENTAL</text>
  <text x="640" y="125" font-family="Arial" font-size="22" fill="#15803d" text-anchor="middle">Conciliação Urbana-Rural | REURB-R</text>
  
  <!-- Tag -->
  <rect x="500" y="620" width="280" height="55" fill="#15803d" rx="27"/>
  <text x="640" y="660" font-family="Arial" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold">SYNERGIA CONT7</text>
</svg>