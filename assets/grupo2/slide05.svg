<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Background -->
  <rect width="1280" height="720" fill="#f0fdf4"/>
  
  <!-- Forest recovery area -->
  <g transform="translate(180, 180)">
    <ellipse cx="0" cy="0" rx="220" ry="170" fill="#228b22" opacity="0.5"/>
    <g fill="#228b22">
      <polygon points="55,55 68,18 82,55"/>
      <polygon points="110,45 128,0 146,45"/>
      <polygon points="175,50 192,15 210,50"/>
      <polygon points="-25,60 0,20 25,60"/>
      <polygon points="-85,55 -60,15 -35,55"/>
    </g>
    <g transform="translate(-55, -35)">
      <rect x="-6" y="0" width="12" height="70" fill="#8b4513"/>
      <polygon points="-45,0 0,-90 45,0" fill="#228b22"/>
      <polygon points="-35,-22 0,-75 35,-22" fill="#2d8b2d"/>
    </g>
  </g>
  
  <!-- Community leader and environmental officer -->
  <g transform="translate(640, 330)">
    <g transform="translate(-110, 0)">
      <circle cx="0" cy="-55" r="32" fill="#f5deb3"/>
      <rect x="-28" y="-23" width="56" height="78" fill="#15803d"/>
      <circle cx="22" cy="-35" r="12" fill="#ffd700"/>
      <text x="22" y="-30" font-family="Arial" font-size="8" fill="#1a365d" text-anchor="middle">SEMA</text>
    </g>
    <g transform="translate(110, 0)">
      <circle cx="0" cy="-55" r="30" fill="#f5deb3"/>
      <rect x="-25" y="-25" width="50" height="72" fill="#1a365d"/>
    </g>
    <path d="M-35,22 L0,10 L35,22" fill="none" stroke="#15803d" stroke-width="10"/>
  </g>
  
  <!-- TAC document -->
  <g transform="translate(850, 150)">
    <rect x="0" y="0" width="330" height="240" fill="#ffffff" stroke="#15803d" stroke-width="3"/>
    <rect x="0" y="0" width="330" height="45" fill="#15803d"/>
    <text x="165" y="32" font-family="Arial" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">TERMO DE AJUSTE</text>
    <text x="165" y="60" font-family="Arial" font-size="15" fill="#15803d" text-anchor="middle">DE CONDUTA - TAC</text>
    <line x1="30" y1="80" x2="300" y2="80" stroke="#c0c0c0"/>
    <text x="30" y="108" font-family="Arial" font-size="12" fill="#4a5568">Ministério Público + SEMA + Comunidade</text>
    <text x="30" y="135" font-family="Arial" font-size="12" fill="#1a365d">Prazo: 24 meses</text>
    <text x="30" y="162" font-family="Arial" font-size="12" fill="#1a365d">Meta: Recuperação Reserva Legal</text>
    <circle cx="280" cy="200" r="35" fill="#15803d" opacity="0.8"/>
    <text x="280" y="206" font-family="Arial" font-size="11" fill="#ffffff" text-anchor="middle">ASSINADO</text>
  </g>
  
  <!-- PRA program -->
  <g transform="translate(850, 440)">
    <rect x="0" y="0" width="330" height="165" fill="#e0f2fe" stroke="#3b82f6" stroke-width="2" rx="10"/>
    <text x="165" y="32" font-family="Arial" font-size="15" fill="#1a365d" text-anchor="middle" font-weight="bold">PROGRAMA DE REGULARIZAÇÃO</text>
    <text x="165" y="58" font-family="Arial" font-size="13" fill="#4a5568" text-anchor="middle">AMBIENTAL - PRA</text>
    <line x1="30" y1="80" x2="300" y2="80" stroke="#3b82f6"/>
    <text x="30" y="108" font-family="Arial" font-size="12" fill="#1a365d">Custo: R$ 1.200/ha (SEMA-MT)</text>
    <text x="30" y="140" font-family="Arial" font-size="14" fill="#b91c1c" font-weight="bold">Passivo: 50 ha × R$ 1.200 = R$ 60.000</text>
  </g>
  
  <!-- Wildlife -->
  <g transform="translate(130, 480)">
    <ellipse cx="0" cy="0" rx="70" ry="45" fill="#228b22" opacity="0.3"/>
    <path d="M-25,-12 Q0,-30 25,-12 Q12,-6 0,-12 Q-12,-6 -25,-12" fill="#ffd700"/>
    <ellipse cx="25" cy="-5" rx="18" ry="12" fill="#1a365d"/>
    <polygon points="38,-5 62,2 38,9" fill="#ff6347"/>
  </g>
  
  <!-- River -->
  <path d="M0,660 Q350,600 700,690 Q1050,620 1280,680" fill="#4169e1" opacity="0.5"/>
  
  <!-- Text -->
  <text x="640" y="55" font-family="Arial" font-size="38" font-weight="bold" fill="#1a365d" text-anchor="middle">TAC E O PRA</text>
  <text x="640" y="100" font-family="Arial" font-size="20" fill="#15803d" text-anchor="middle">Compensação Ambiental via regularização</text>
</svg>